services:
  postgres:
    image: ankane/pgvector:latest
    container_name: wpd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wpd_qa}
      POSTGRES_USER: ${POSTGRES_USER:-wpd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wpd_password_123}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wpd_user} -d ${POSTGRES_DB:-wpd_qa}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wpd-network
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: wpd-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - wpd-network
    restart: unless-stopped

  

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  wpd-network:
    driver: bridge